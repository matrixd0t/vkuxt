name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run ruff check src tests examples
      - run: uv run pyright
      - run: uv build
